<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARC Lab — Interactive Abstract Reasoning Laboratory (demo)</title>
  <meta name="description" content="Static client-side demo of ARC Lab: solve ARC puzzles, search transformation programs, and evaluate solver baselines — powered by the same arc-core as the full app." />
  <style>
    :root {
      --bg: #0c0c0e;
      --card: #16161a;
      --border: #2a2a30;
      --text: #ececee;
      --muted: #9a9aa3;
      --accent: #10b981;
      --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 12px 20px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: rgba(12,12,14,.92); backdrop-filter: blur(6px); z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { display: grid; grid-template-columns: 10px 10px; gap: 2px; padding: 3px; border-radius: 6px; background: #333; }
    .logo span { width: 10px; height: 10px; border-radius: 2px; display: block; }
    .tagline { color: var(--muted); font-size: 12px; }
    nav { display: flex; gap: 4px; margin-left: auto; }
    .navlink {
      background: none; border: 1px solid transparent; color: var(--muted); padding: 6px 12px;
      border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .navlink.active { color: var(--text); background: #232329; border-color: var(--border); }
    .xp { font-weight: 700; color: var(--amber); font-size: 13px; }
    main { flex: 1; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .foot {
      border-top: 1px solid var(--border); padding: 14px 20px; color: var(--muted);
      font-size: 12.5px; margin-top: auto; text-align: center;
    }
    .foot a { color: var(--accent); }
    .play { display: grid; grid-template-columns: 250px 1fr; gap: 18px; }
    @media (max-width: 820px) { .play { grid-template-columns: 1fr; } .side { order: 2; } }
    .side { display: flex; flex-direction: column; gap: 10px; }
    .side-block { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
    .mini-label { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .worldhead {
      display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: none;
      color: var(--text); font-weight: 700; font-size: 13.5px; cursor: pointer; text-align: left; padding: 2px 0;
    }
    .wnum {
      width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
      font-family: ui-monospace, monospace; font-size: 12px; font-weight: 800; color: #000; flex-shrink: 0;
    }
    .dcount { color: var(--muted); font-weight: 500; }
    .lvlist { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
    .lvlbtn {
      display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent;
      color: var(--text); padding: 7px 9px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .lvlbtn:hover { background: #202027; }
    .lvlbtn.active { background: #232329; border-color: var(--border); }
    .lvlbtn.solved { color: var(--accent); }
    .mono { font-family: ui-monospace, monospace; color: var(--muted); font-size: 11px; }
    .content { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .levelhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    h2 { font-size: 20px; margin-bottom: 2px; }
    h3 { font-size: 15px; margin: 10px 0 8px; }
    .badge { border: 1px solid var(--border); color: var(--muted); padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .muted { color: var(--muted); font-size: 13.5px; margin: 6px 0 12px; }
    .small { font-size: 12px; }
    .pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .pair {
      display: flex; align-items: center; gap: 10px; border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; background: #101014;
    }
    .pair-num {
      width: 22px; height: 22px; border-radius: 99px; background: #232329; display: inline-flex;
      align-items: center; justify-content: center; font-family: ui-monospace, monospace; font-size: 11px; flex-shrink: 0;
    }
    .arrow { color: var(--muted); }
    .arrow.big { font-size: 22px; }
    .arcgrid {
      display: grid; gap: 1px; padding: 2px; background: #3a3a42; border-radius: 5px; width: fit-content;
    }
    .cell { display: block; }
    .cell.clickable { cursor: crosshair; }
    .challenge { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 12px; }
    .palette { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
    .swatch { width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; }
    .swatch.selected { border-color: var(--accent); outline: 1px solid var(--accent); }
    .tools { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .btn {
      background: #232329; color: var(--text); border: 1px solid var(--border); padding: 8px 14px;
      border-radius: 9px; cursor: pointer; font-size: 13.5px; font-weight: 600; text-decoration: none; display: inline-block;
    }
    .btn:hover { border-color: #3d3d46; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #04110b; }
    .btn:disabled { opacity: .5; cursor: default; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .hints { background: #1c1a10; border: 1px solid #3a331a; border-radius: 10px; padding: 10px 14px; margin: 8px 0; }
    .hints p { font-size: 13.5px; margin: 4px 0; }
    .result { border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 14px; }
    .result.ok { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.4); }
    .result.bad { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.35); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .wraprow { align-items: flex-end; }
    .select {
      background: #101014; color: var(--text); border: 1px solid var(--border); border-radius: 9px;
      padding: 8px 10px; font-size: 13.5px; max-width: 320px;
    }
    .num { width: 80px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .chip {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: #101014;
      color: var(--muted); cursor: pointer; font-weight: 700; font-size: 13px;
    }
    .chip.wide { width: auto; padding: 0 10px; }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #04110b; }
    .panel { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 14px; background: #101014; }
    .cand { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1d1d23; flex-wrap: wrap; }
    .cand:last-of-type { border-bottom: none; }
    .cand code { font-family: ui-monospace, monospace; font-size: 12.5px; color: #d9d9de; }
    .pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: #232329; color: var(--muted); }
    .pill.ok { background: rgba(16,185,129,.15); color: var(--accent); }
    .tracectl { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .stepbtn {
      min-width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: #101014;
      color: var(--text); cursor: pointer; font-family: ui-monospace, monospace; font-size: 12px;
    }
    .stepbtn.active { background: var(--accent); color: #04110b; border-color: var(--accent); }
    .mtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .mtable th { text-align: left; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .mtable td { padding: 9px 10px; border-bottom: 1px solid #1d1d23; }
    .mtable td.best { color: var(--accent); font-weight: 700; }
    .about { max-width: 720px; }
    .about ul { margin: 10px 0 10px 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
    .about p { font-size: 14px; margin-bottom: 8px; }
    code { background: #202027; padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./bundle.js"></script>
</body>
</html>
